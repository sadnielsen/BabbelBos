version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      aspire:
        patterns: ["Aspire*"]
      wolverine:
        patterns: ["WolverineFx*"]
      xunit:
        patterns: ["xunit*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /src/Babbelbos.Api
    schedule:
      interval: weekly
