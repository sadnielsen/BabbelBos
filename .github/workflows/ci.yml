name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build, format and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'

      - name: Restore
        run: dotnet restore Babbelbos.slnx

      - name: Check formatting
        run: dotnet format Babbelbos.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build Babbelbos.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test --solution Babbelbos.slnx --no-build --configuration Release

      - name: Check for vulnerable packages
        run: |
          dotnet list Babbelbos.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          ! grep -q -i "has the following vulnerable packages" vulnerable.txt

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f src/Babbelbos.Api/Dockerfile -t babbelbos-api:${{ github.sha }} .
